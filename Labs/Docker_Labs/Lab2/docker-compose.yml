services:
  # Service 1: Train the model
  model-training:
    image: python:3.10-slim
    container_name: wine_trainer
    working_dir: /app
    volumes:
      - ./src:/app/src
      - ./requirements.txt:/app/requirements.txt
      - model_exchange:/exchange   # Shared volume mount
    # Run training -> Copy result to shared folder
    command: >
      sh -c "pip install --no-cache-dir -r requirements.txt &&
             python src/model_training.py &&
             cp wine_model.joblib /exchange/wine_model.joblib"

  # Service 2: Serve the model
  serving:
    image: python:3.10-slim
    container_name: wine_serving
    working_dir: /app
    ports:
      - "4000:4000"
    volumes:
      - ./src:/app/src
      - ./requirements.txt:/app/requirements.txt
      - model_exchange:/exchange   # Shared volume mount
    depends_on:
      model-training:
        condition: service_completed_successfully
    # Copy result FROM shared folder -> Run server
    command: >
      sh -c "pip install --no-cache-dir -r requirements.txt &&
             cp /exchange/wine_model.joblib ./wine_model.joblib &&
             python src/main.py"

volumes:
  model_exchange:
